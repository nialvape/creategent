# Points ComfyUI at the RunPod network volume instead of its in-image models dir.
#
# On a serverless worker the volume mounts at /runpod-volume; on a pod (which is
# how you populate it) the same volume mounts at /workspace. Download into
# /workspace/models/... and the paths below line up at runtime.
#
# Every folder ComfyUI knows about is mapped, not just the ones a current model
# needs. Adding a mapping means rebuilding the image (this file is COPYed in),
# so mapping everything up front keeps "drop a new model on the volume" from
# turning into a 40-minute rebuild. LTX 2.5 already needs two folders H3 did
# not: model_patches (duration head) and latent_upscale_models.
runpod_volume:
  base_path: /runpod-volume/
  checkpoints: models/checkpoints/
  diffusion_models: models/diffusion_models/
  text_encoders: models/text_encoders/
  clip_vision: models/clip_vision/
  vae: models/vae/
  vae_approx: models/vae_approx/
  loras: models/loras/
  embeddings: models/embeddings/
  controlnet: models/controlnet/
  style_models: models/style_models/
  gligen: models/gligen/
  hypernetworks: models/hypernetworks/
  photomaker: models/photomaker/
  upscale_models: models/upscale_models/
  latent_upscale_models: models/latent_upscale_models/
  model_patches: models/model_patches/
  audio_encoders: models/audio_encoders/
  background_removal: models/background_removal/
  frame_interpolation: models/frame_interpolation/
  geometry_estimation: models/geometry_estimation/
  optical_flow: models/optical_flow/
  detection: models/detection/
  classifiers: models/classifiers/
  diffusers: models/diffusers/
  configs: models/configs/
